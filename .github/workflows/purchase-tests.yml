name: Purchase UI tests

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purchase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: qa
      QA_BASE_URL: https://rahulshettyacademy.com/client
      BROWSER: chrome
      HEADLESS: "true"
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run Purchase suite
        run: mvn --batch-mode --no-transfer-progress -P Purchase test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
